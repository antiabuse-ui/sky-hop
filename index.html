<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#132c3e">
<meta name="description" content="Sky Hop — бесплатная пиксельная аркада. Лети, собирай монеты и побей свой рекорд.">
<title>Sky Hop — пиксельный полёт</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<script src="storage.js" defer></script><script src="wallet.js" defer></script><script src="rules.js" defer></script><script src="telegram.js" defer></script><script src="game.js" defer></script>
</head>
<body data-state="loading"><main>
<header><span class="brand">SKY HOP <small>пиксельный полёт</small></span><button id="fullscreen" class="icon-button" hidden aria-label="Переключить полноэкранный режим" title="На весь экран">⛶</button></header>
<section class="stats" aria-label="Результаты"><div>СЧЁТ<strong id="score">—</strong></div><div>РЕКОРД<strong id="best">—</strong></div><div class="wallet">МОНЕТЫ<strong><span aria-hidden="true" class="coin-icon">◆</span> <span id="coins">—</span></strong></div></section>
<div class="toolbar"><button id="pause" class="icon-button" aria-label="Пауза" title="Пауза · Escape" hidden><span aria-hidden="true">Ⅱ</span></button><span id="flight-best" class="flight-best"></span><span id="shield" class="shield" hidden></span></div>
<div class="notice-rail"><div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true" hidden><span id="toast-text"></span></div></div>
<div id="stage" class="stage"><div class="field" id="field"><canvas id="game" width="420" height="600" tabindex="0" aria-label="Нажимайте пробел или поле, чтобы лететь вверх. Escape — пауза."></canvas>
<div id="overlay" class="overlay"><div class="panel"><p id="eyebrow" class="eyebrow">ПОЙМАЙ СВОЙ РИТМ</p><h1 id="title">Выше облаков.</h1><p id="message">Лети между трубами.<br>Собирай монеты. Не сдавайся.</p><p id="death-message" class="death-message" hidden></p><p id="result" class="result" hidden></p><button id="revive" class="revive" hidden disabled>Продолжить игру — 20 монет</button><button id="play" disabled>Загружаем прогресс…</button><button id="menu" class="secondary" hidden>Меню</button><p id="feedback" class="feedback" role="status"></p></div></div></div></div>
<footer><span>КАСАНИЕ / ПРОБЕЛ</span><span>ПАУЗА: ESC</span></footer>
<p id="status" class="note" role="status">Читаем сохранение…</p><p id="save-warning" class="save-warning" role="alert" hidden></p>
</main></body></html>
